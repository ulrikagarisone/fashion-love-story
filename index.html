<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Fashion Love Story | Dirk Bikkembergs</title>
  <meta name="description"
    content="Explore how Dirk Bikkembergs revolutionized fashion by merging sports and haute couture in the 1980s.">
</head>

<body>

  <!-- HERO SECTION -->
  <section class="hero">
    <div class="hero__background">
      <svg class="hero__xoxo" viewBox="0 0 1200 800" aria-hidden="true">
        <text class="hero__xoxo-text" x="50%" y="50%" text-anchor="middle" dominant-baseline="middle">XOXO</text>
      </svg>
    </div>

    <div class="hero__container">
      <div class="hero__content">

        <h1 class="hero__title">
          <span class="hero__title-line hero__title-line--top">THE LOVE</span>
          <span class="hero__title-line hero__title-line--bottom">STORY</span>
        </h1>

        <div class="hero__main-image">
          <img src="/images/model_hero.png"
            alt="Dirk Bikkembergs model on runway wearing black leather and neon yellow Lycra" class="hero__model" />
        </div>

        <div class="hero__floating-elements">
          <img src="/images/football-player.png" alt="Football player in motion" class="hero__football" />
          <img src="/images/kissy-face-1.png" alt="Decorative element" class="hero__kissy hero__kissy--1" />
          <img src="/images/kissy-face-2.png" alt="Decorative element" class="hero__kissy hero__kissy--2" />
        </div>

        <p class="hero__tagline">
          One designer's vision.<br />
          The story that changed fashion.
        </p>
      </div>
    </div>

    <div class="hero__logo">
      <span class="hero__logo-text">MM</span>
    </div>
  </section>

  <script type="module" src="/src/js/main.js"></script>
</body>

</html>
